# Supabase pauses free-tier projects after 7 days without activity (e.g. over winter/summer break).
# This pings the database every 3 days so it stays awake.
# Setup: GitHub repo → Settings → Secrets and variables → Actions → add
#   SUPABASE_URL      (e.g. https://abcd1234.supabase.co)
#   SUPABASE_ANON_KEY (the public anon key)
name: Supabase keepalive

on:
  schedule:
    - cron: "0 15 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query events table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "SUPABASE_URL secret not set; skipping."; exit 0; fi
          curl --fail -sS "$SUPABASE_URL/rest/v1/events?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
